name: Deploy Trading Screener

on:
  push:
    branches:
      - main
  schedule:
    # Weekdays at 3:00 AM Hong Kong time after US trading days (19:00 UTC Mon-Fri)
    - cron: '0 19 * * 1-5'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate screener HTML
        run: |
          python generate_html.py

      - name: Commit generated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screener.html index.html data/gamma_contract_history.json
          git diff --cached --quiet || git commit -m "chore: update screener data"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      # Upload and deploy must be separate jobs. In one job, deploy-pages can
      # list artifacts before this upload is visible and fail with
      # "No artifacts named github-pages were found", which leaves the previous
      # board (and its chart bars) live. See actions/deploy-pages#451.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
